name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  deploy-easypanel:
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_WEBHOOK: ${{ secrets.EASYPANEL_DEPLOY_WEBHOOK }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate project structure
        run: sh scripts/validate.sh

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Lint
        run: npm run lint

      - name: Build Next.js
        run: npm run build

      - name: Build Docker image
        run: docker build -t cairis-cloud:${{ github.sha }} .

      - name: Smoke test container
        run: |
          docker run -d --rm --name cairis-cloud-smoke -p 8080:80 cairis-cloud:${{ github.sha }}
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/healthz | grep -q ok; then
              docker stop cairis-cloud-smoke
              exit 0
            fi
            sleep 1
          done
          docker logs cairis-cloud-smoke
          docker stop cairis-cloud-smoke
          exit 1

      - name: Trigger Easypanel deploy
        if: ${{ env.DEPLOY_WEBHOOK != '' }}
        run: curl -fsS -X POST "$DEPLOY_WEBHOOK"

      - name: Explain skipped deploy
        if: ${{ env.DEPLOY_WEBHOOK == '' }}
        run: |
          echo "EASYPANEL_DEPLOY_WEBHOOK is not configured."
          echo "Add the deploy hook URL as a GitHub Actions secret to enable automatic production deploys."
